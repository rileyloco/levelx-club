[build]
  command = "npm --prefix prototype install && npm --prefix prototype run build"
  publish = "prototype/dist/client"

[build.environment]
  NODE_VERSION = "22"
  VITE_SITE_URL = "https://levelxclub.com.au"

[[headers]]
  for = "/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/og.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/fitness"
  to = "/#the-club"
  status = 301

[[redirects]]
  from = "/about"
  to = "/#about"
  status = 301

[[redirects]]
  from = "/trainers"
  to = "/locations/toowong"
  status = 301

[[redirects]]
  from = "/events/*"
  to = "/events"
  status = 301
